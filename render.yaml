# SafeNaija on Render — Blueprint
# https://render.com/docs/blueprint-spec
services:
  # FastAPI offline engine (slim requirements, no torch)
  - type: web
    name: safenaija-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn safeo_backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /nigeria/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BAND_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: "*"

  # Vite SPA via Node `serve -s` so React Router paths work on free tier.
  - type: web
    name: safenaija-web
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend/website
    buildCommand: npm ci && npm run build
    startCommand: npx --yes serve -s dist -l tcp://0.0.0.0:$PORT
    envVars:
      - key: VITE_API_BASE
        fromService:
          name: safenaija-api
          type: web
          property: host
