# SafeNaija on Render — Blueprint
# https://render.com/docs/blueprint-spec
services:
  # FastAPI offline engine (slim requirements, no torch)
  - type: web
    name: safenaija-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn safeo_backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /nigeria/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BAND_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: "*"

  # Vite SPA (static). VITE_API_BASE points at the API public host.
  - type: web
    name: safenaija-web
    runtime: static
    rootDir: frontend/website
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: VITE_API_BASE
        fromService:
          name: safenaija-api
          type: web
          property: host
